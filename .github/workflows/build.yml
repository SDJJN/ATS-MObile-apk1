name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-pip \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev \
            cmake \
            ant \
            autoconf \
            automake \
            libtool \
            openjdk-17-jdk \
            gettext \
            unzip \
            zip \
            pkg-config

      - name: Install Buildozer and Cython
        run: |
          pip install --user buildozer
          pip install --user cython==0.29.33

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ats-analyzer-apk
          path: bin/*.apk
